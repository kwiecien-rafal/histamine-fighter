services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=histamine
      - POSTGRES_PASSWORD=histamine
      - POSTGRES_DB=histamine
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U histamine -d histamine"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./seed_data:/app/seed_data
      - fastembed_cache:/app/.cache/fastembed
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://histamine:histamine@db:5432/histamine
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - FASTEMBED_CACHE_PATH=/app/.cache/fastembed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  fastembed_cache:
